openapi: 3.0.3
info:
  title: EnergyShark City Node API
  version: 1.0.0
  description: API JSON de consulta del nodo REE.
servers:
  - url: https://api.example.com
    description: API Gateway de produccion
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        '200':
          description: Servicio disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /events:
    post:
      security: []
      description: Endpoint interno usado por connector despues de persistir el mensaje recibido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Envelope'
      responses:
        '201':
          description: Evento persistido
        '200':
          description: idpk ya persistido; no se reaplica
        '400':
          description: Request invalida
  /history:
    get:
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: cycleId
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string }
      responses:
        '200':
          description: Historial paginado de mensajes persistidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEvents'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /history/{id}:
    get:
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Evento encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Evento no encontrado
  /connectivity:
    get:
      responses:
        '200':
          description: Ultima distance-table recibida
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Event'
                  - type: object
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /negotiations:
    get:
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Propuestas, confirmaciones, pagos y errores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEvents'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Token Auth0 ausente o invalido
  schemas:
    Health:
      type: object
      required: [status, uptime, count]
      properties:
        status: { type: string, example: ok }
        uptime: { type: number }
        count: { type: integer }
    Envelope:
      type: object
      required: [idpk, msgId, type, timestamp, data]
      properties:
        idpk: { type: string, format: uuid }
        msgId: { type: string, format: uuid }
        type: { type: string }
        timestamp: { type: string, format: date-time }
        cycleId: { type: string }
        cityId: { type: string, example: REE }
        data: { type: object, additionalProperties: true }
    Event:
      type: object
      required: [id, idpk, type, receivedAt]
      properties:
        id: { type: string, format: uuid }
        idpk: { type: string }
        msgId: { type: string, format: uuid, nullable: true }
        type: { type: string }
        cycleId: { type: string, nullable: true }
        data: { type: object, additionalProperties: true }
        receivedAt: { type: string, format: date-time }
    PaginatedEvents:
      type: object
      required: [data]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/Event' }
