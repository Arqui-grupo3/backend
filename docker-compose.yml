services:
  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-energyshark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energyshark}
      POSTGRES_DB: ${POSTGRES_DB:-energyshark}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-energyshark} -d ${POSTGRES_DB:-energyshark}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - energyshark

  master:
    build: ./master
    container_name: master
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-energyshark}
      PGPASSWORD: ${POSTGRES_PASSWORD:-energyshark}
      PGDATABASE: ${POSTGRES_DB:-energyshark}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-energyshark-master}
      CONNECTOR_URL: http://connector:3001
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      AUTH0_JWKS_URL: ${AUTH0_JWKS_URL:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - energyshark

  connector:
    build: ./connector
    container_name: connector
    restart: unless-stopped
    env_file:
      - ./connector/.env
    environment:
      MASTER_URL: http://master:3000/events
      CONNECTOR_CONTROL_PORT: 3001
    depends_on:
      - master
    networks:
      - energyshark

networks:
  energyshark:
    driver: bridge

volumes:
  db_data:
