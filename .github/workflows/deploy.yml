name: Deploy a producción

# Se dispara solo con push a main. Las ramas de trabajo no despliegan nada.
on:
  push:
    branches: [main]
  workflow_dispatch:      # permite lanzarlo a mano desde la pestaña Actions

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 088674918891.dkr.ecr.us-east-2.amazonaws.com

jobs:
  build-and-push:
    name: Construir y publicar imágenes en ECR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Cada imagen se publica con dos etiquetas: latest, que es la que el
      # compose de producción usa, y el SHA del commit, que permite saber
      # exactamente qué versión está corriendo y volver atrás si hace falta.
      - name: Construir y publicar master
        run: |
          docker build \
            -t $ECR_REGISTRY/energyshark/master:latest \
            -t $ECR_REGISTRY/energyshark/master:${{ github.sha }} \
            ./master
          docker push $ECR_REGISTRY/energyshark/master:latest
          docker push $ECR_REGISTRY/energyshark/master:${{ github.sha }}

      - name: Construir y publicar connector
        run: |
          docker build \
            -t $ECR_REGISTRY/energyshark/connector:latest \
            -t $ECR_REGISTRY/energyshark/connector:${{ github.sha }} \
            ./connector
          docker push $ECR_REGISTRY/energyshark/connector:latest
          docker push $ECR_REGISTRY/energyshark/connector:${{ github.sha }}

  deploy:
    name: Desplegar en la EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Opciones compartidas por todas las conexiones al servidor:
    #   ServerAliveInterval  manda un latido cada 30 s para que el NAT no corte
    #                        la conexión mientras el pull descarga en silencio
    #   StrictHostKeyChecking=accept-new  acepta la huella la primera vez, sin
    #                        depender de que ssh-keyscan haya funcionado
    #   ConnectTimeout       falla rápido si el host no responde, en vez de
    #                        quedarse colgado hasta el timeout del job
    env:
      SSH_OPTS: >-
        -o ServerAliveInterval=30
        -o ServerAliveCountMax=20
        -o StrictHostKeyChecking=accept-new
        -o ConnectTimeout=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar la llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan es best-effort: si falla, accept-new resuelve la huella
          # igual. Sin el || true, un fallo suyo tumba todo el despliegue.
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # El compose de producción viaja del repo al servidor en cada deploy,
      # así la máquina nunca queda con una versión distinta a la del repo.
      - name: Copiar el compose de producción
        run: |
          scp -i ~/.ssh/deploy_key $SSH_OPTS docker-compose.prod.yml \
            ubuntu@${{ secrets.EC2_HOST }}:~/energyshark/docker-compose.prod.yml

      - name: Pull y levantar
        run: |
          ssh -i ~/.ssh/deploy_key $SSH_OPTS \
              ubuntu@${{ secrets.EC2_HOST }} bash -s <<'REMOTE'
            set -euo pipefail
            cd ~/energyshark

            # La EC2 no tiene credenciales guardadas: obtiene un token de ECR
            # de 12 horas a través del rol de instancia ec2-ecr-pull.
            aws ecr get-login-password --region us-east-2 \
              | sudo docker login --username AWS --password-stdin \
                  088674918891.dkr.ecr.us-east-2.amazonaws.com

            sudo docker compose -f docker-compose.prod.yml pull master connector
            sudo docker compose -f docker-compose.prod.yml up -d
            sudo docker compose -f docker-compose.prod.yml ps
          REMOTE

      # Se verifica contra el dominio público, no contra localhost del servidor:
      # así se comprueba el camino completo (DNS, TLS, Nginx y la aplicación).
      - name: Verificar que la API responde
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 https://www.fasantamaria.me/health; then
              echo ""
              echo "API respondiendo en el intento $i"
              exit 0
            fi
            echo "Intento $i: todavía no responde, reintento en 10 s..."
            sleep 10
          done
          echo "La API no respondió tras 20 intentos"
          exit 1
