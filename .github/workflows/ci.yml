name: Pruebas

# Corre en cada PR y en cada push a develop. deploy.yml también lo llama antes de
# construir las imágenes, así que main no se despliega con pruebas fallando.
on:
  pull_request:
  push:
    branches: [develop]
  workflow_call:

jobs:
  master:
    name: master (unitarias, integración y contrato)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Las pruebas de master usan un Postgres real (cada prueba crea su propio schema).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      NEW_RELIC_ENABLED: "false"
    defaults:
      run:
        working-directory: master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: master/package-lock.json
      - run: npm ci
      - run: npm test

  connector:
    name: connector (validación y contrato)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: connector/package-lock.json
      - run: npm ci
      - run: npm test
